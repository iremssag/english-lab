<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Term Duel — Bacteriocin Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TERMS — EDIT HERE (see the <script> block at the bottom)
   ============================================================ */
:root{
  --ink:#241A46;        /* crystal violet, deep — text */
  --violet:#6B3FA0;     /* Gram-positive stain */
  --safranin:#E0517A;   /* counterstain pink */
  --agar:#EAD8A6;       /* MRS medium */
  --agar-deep:#D9BF7E;
  --glass:#DCE7EA;      /* pale lab glass — page */
  --glass-2:#EEF4F5;
  --fluoro:#25C07A;     /* fluorescence green */
  --shadow:rgba(36,26,70,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  background:
    radial-gradient(circle at 15% 10%, #fff 0%, transparent 45%),
    radial-gradient(circle at 85% 90%, #fff 0%, transparent 40%),
    var(--glass);
  color:var(--ink);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:20px 16px 40px;
}

/* ---------- header ---------- */
header{width:100%;max-width:860px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
h1{
  font-family:Archivo,sans-serif;font-weight:900;font-size:clamp(20px,3vw,28px);
  letter-spacing:-.02em;margin:0;text-transform:uppercase;
}
h1 em{font-style:normal;color:var(--safranin)}
.sub{font-size:13px;opacity:.6;margin:0}

/* ---------- mode switch ---------- */
.modes{display:flex;gap:0;background:var(--glass-2);border-radius:999px;padding:4px;margin-left:auto;box-shadow:inset 0 1px 3px var(--shadow)}
.modes button{
  font-family:"IBM Plex Sans",sans-serif;font-size:13px;font-weight:600;
  border:0;background:transparent;color:var(--ink);opacity:.55;
  padding:8px 16px;border-radius:999px;cursor:pointer;transition:.18s;
}
.modes button[aria-pressed="true"]{background:var(--ink);color:#fff;opacity:1}
.modes button:focus-visible{outline:3px solid var(--safranin);outline-offset:2px}

/* ---------- the dish ---------- */
.stage{position:relative;width:min(88vw,460px);aspect-ratio:1;margin:6px 0 4px}
.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .track{stroke:rgba(36,26,70,.10);stroke-width:6}
.ring .bar{stroke:var(--safranin);stroke-width:6;transition:stroke-dashoffset .95s linear}

.dish{
  position:absolute;inset:18px;border-radius:50%;
  background:
    radial-gradient(circle at 22% 18%, rgba(255,255,255,.85) 0 4px, transparent 5px),
    radial-gradient(circle at 74% 30%, rgba(255,255,255,.6) 0 3px, transparent 4px),
    radial-gradient(circle at 34% 78%, rgba(255,255,255,.5) 0 5px, transparent 6px),
    radial-gradient(circle at 66% 71%, rgba(255,255,255,.55) 0 3px, transparent 4px),
    radial-gradient(circle at 50% 40%, var(--agar) 0%, var(--agar-deep) 100%);
  box-shadow:
    0 18px 40px -12px var(--shadow),
    inset 0 0 0 10px rgba(255,255,255,.30),
    inset 0 0 0 11px rgba(36,26,70,.10);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:12% 13%;cursor:pointer;
  transition:transform .2s;
}
.dish:active{transform:scale(.985)}
.dish:focus-visible{outline:4px solid var(--violet);outline-offset:6px}

.eyebrow{
  font-family:Archivo,sans-serif;font-weight:700;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(36,26,70,.5);margin-bottom:14px;
}
.prompt{
  font-family:Archivo,sans-serif;font-weight:700;
  font-size:clamp(19px,4.4vw,30px);line-height:1.18;letter-spacing:-.015em;
  margin:0;
}
.prompt.term{font-weight:900;text-transform:lowercase;font-size:clamp(24px,6vw,42px)}
.trline{
  font-family:"IBM Plex Sans",sans-serif;font-weight:400;
  font-size:clamp(12px,2.5vw,14.5px);line-height:1.5;
  color:rgba(36,26,70,.58);margin:8px auto 0;max-width:32ch;
}
.trline[hidden]{display:none}
.answer .trterm{font-size:13px;color:var(--safranin);font-weight:600;margin-top:5px}
.answer{margin-top:16px;border-top:2px dotted rgba(36,26,70,.28);padding-top:14px;width:100%}
.answer[hidden]{display:none}
.answer .word{font-family:Archivo,sans-serif;font-weight:900;font-size:clamp(20px,5vw,34px);letter-spacing:-.02em;color:var(--violet)}
.answer .say{font-size:14px;font-style:italic;opacity:.72;margin-top:4px}
.tap{font-size:12px;opacity:.45;margin-top:16px;letter-spacing:.04em}

/* ---------- controls ---------- */
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
button.act{
  font-family:Archivo,sans-serif;font-weight:700;font-size:14px;letter-spacing:.02em;
  border:2px solid var(--ink);background:#fff;color:var(--ink);
  padding:11px 20px;border-radius:12px;cursor:pointer;transition:.15s;
}
button.act:hover{transform:translateY(-2px)}
button.act:focus-visible{outline:3px solid var(--safranin);outline-offset:3px}
button.act.good{background:var(--fluoro);border-color:var(--fluoro);color:#06301E}
button.act.again{background:var(--safranin);border-color:var(--safranin);color:#fff}
button.act.ghost{background:transparent;border-color:rgba(36,26,70,.3);opacity:.75;font-weight:500}

/* ---------- scoreboard ---------- */
.board{display:flex;gap:22px;margin-top:24px;font-size:13px;align-items:center;flex-wrap:wrap;justify-content:center}
.board b{font-family:Archivo,sans-serif;font-weight:900;font-size:22px;display:block;line-height:1}
.board .cell{text-align:center;min-width:64px}
.board .cell span{opacity:.55;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.board .closed b{color:var(--fluoro)}
.board .redo b{color:var(--safranin)}

.hint{margin-top:26px;font-size:12px;opacity:.5;max-width:460px;text-align:center;line-height:1.6}
kbd{font-family:inherit;background:#fff;border:1px solid rgba(36,26,70,.25);border-radius:5px;padding:1px 6px;font-size:11px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div>
    <h1>Term <em>Duel</em></h1>
    <p class="sub">Bacteriocin project · 20 words</p>
  </div>
  <div class="modes" role="group" aria-label="Game mode">
    <button id="m1" aria-pressed="true">Name the term</button>
    <button id="m2" aria-pressed="false">Use it in a sentence</button>
  </div>
</header>

<div class="stage">
  <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="track" cx="50" cy="50" r="47"/>
    <circle class="bar" cx="50" cy="50" r="47" stroke-dasharray="295.3" stroke-dashoffset="295.3"/>
  </svg>
  <div class="dish" id="dish" tabindex="0" role="button" aria-live="polite">
    <div class="eyebrow" id="eyebrow">What is it?</div>
    <p class="prompt" id="prompt">Press start</p>
    <div class="answer" id="answer" hidden>
      <div class="word" id="word"></div>
      <div class="say" id="say"></div>
      <div class="trterm" id="trterm"></div>
      <p class="trline" id="trline"></p>
    </div>
    <div class="tap" id="tap">tap the dish to reveal</div>
  </div>
</div>

<div class="controls">
  <button class="act good" id="good">Closed ✓</button>
  <button class="act again" id="again">Try again ↻</button>
  <button class="act ghost" id="timer">Start 60s</button>
  <button class="act ghost" id="trBtn">TR: açık</button>
  <button class="act ghost" id="reset">Reshuffle</button>
</div>

<div class="board">
  <div class="cell closed"><b id="sClosed">0</b><span>Closed</span></div>
  <div class="cell redo"><b id="sRedo">0</b><span>Redo</span></div>
  <div class="cell"><b id="sLeft">20</b><span>Left</span></div>
  <div class="cell"><b id="sTime">60</b><span>Seconds</span></div>
</div>

<p class="hint">
  <kbd>space</kbd> reveal / next · <kbd>1</kbd> closed · <kbd>2</kbd> try again · <kbd>t</kbd> timer
</p>

<script>
/* ============================================================
   YOUR WORD LIST — edit freely.
   term  : the English word the students must produce
   def   : the plain-English clue they hear/see first
   say   : rough pronunciation, Turkish reading
   ============================================================ */
const TERMS = [
  {term:"lactic acid bacteria", def:"The helpful bacteria that live in cheese and yoghurt and turn milk sour.", say:"LAK-tik A-sid bak-Tİ-ri-a", tr:"laktik asit bakterileri", trd:"Peynir ve yoğurtta yaşayan, sütü ekşiten yararlı bakteriler."},
  {term:"bacteriocin",          def:"A tiny protein that bacteria make to kill other bacteria.", say:"bak-Tİ-ri-o-sin", tr:"bakteriyosin", trd:"Bakterilerin başka bakterileri öldürmek için ürettiği küçük protein."},
  {term:"to isolate",           def:"To take one single thing out of a mixture of many things.", say:"AY-so-leyt", tr:"izole etmek", trd:"Bir karışımın içinden tek bir şeyi ayırıp almak."},
  {term:"culture medium",       def:"The jelly or the liquid that we grow bacteria in.", say:"KAL-çır Mİ-di-ım", tr:"besiyeri", trd:"Bakterileri laboratuvarda büyüttüğümüz jel ya da sıvı besin."},
  {term:"broth",                def:"The liquid version of that growing food, in a flask.", say:"broth", tr:"sıvı besiyeri", trd:"Besiyerinin erlen içindeki sıvı hâli."},
  {term:"incubator",            def:"The warm cabinet where we keep the plates so bacteria grow.", say:"İN-kyu-bey-tır", tr:"etüv / inkübatör", trd:"Petrilerin, bakteriler üresin diye bekletildiği sıcak dolap."},
  {term:"colony",               def:"One small spot on the plate — millions of bacteria from one parent.", say:"KO-lı-ni", tr:"koloni", trd:"Plakadaki tek bir leke — hepsi tek bir bakteriden çoğalmış."},
  {term:"pure culture",         def:"A plate where only one single species is growing.", say:"pyur KAL-çır", tr:"saf kültür", trd:"Üzerinde yalnızca tek bir türün ürediği plaka."},
  {term:"Gram staining",        def:"The colour test: purple or pink tells you what kind of bacteria you have.", say:"gram STEY-ning", tr:"gram boyama", trd:"Mor mu pembe mi — bakterinin tipini gösteren boyama testi."},
  {term:"rod-shaped",           def:"The shape of a bacterium that looks like a little stick.", say:"rod-şeypt", tr:"çubuk şeklinde (basil)", trd:"Küçük bir çubuğa benzeyen bakteri şekli."},
  {term:"spherical",            def:"The shape of a bacterium that looks like a small ball.", say:"SFE-ri-kıl", tr:"küre şeklinde (kok)", trd:"Küçük bir topa benzeyen bakteri şekli."},
  {term:"catalase test",        def:"Drop hydrogen peroxide on it — if it bubbles, the answer is yes.", say:"KA-tı-leyz", tr:"katalaz testi", trd:"Hidrojen peroksit damlatılır — kabarcık çıkarsa cevap evet."},
  {term:"to purify",            def:"To clean a substance until almost nothing else is left in it.", say:"PYU-ri-fay", tr:"saflaştırmak", trd:"Bir maddeyi içinde başka şey kalmayana kadar temizlemek."},
  {term:"zone of inhibition",   def:"The clear ring around the disk where no bacteria could grow.", say:"in-hi-Bİ-şın", tr:"inhibisyon zonu", trd:"Diskin çevresinde bakterinin üreyemediği şeffaf halka."},
  {term:"nisin",                def:"The bacteriocin you can buy in a shop — we compared ours against it.", say:"NAY-sin", tr:"nisin", trd:"Hazır satılan bakteriyosin — kendi ürünümüzü onunla kıyasladık."},
  {term:"cell culture",         def:"Growing human cells in a dish so we can test things on them.", say:"sel KAL-çır", tr:"hücre kültürü", trd:"İnsan hücrelerini kapta büyütüp üzerlerinde deney yapmak."},
  {term:"cell viability",       def:"How many of the cells are still alive after the treatment.", say:"vay-ı-Bİ-li-ti", tr:"hücre canlılığı", trd:"Uygulamadan sonra hücrelerin kaçının hâlâ yaşadığı."},
  {term:"cytotoxic",            def:"A word that describes something which kills cells.", say:"say-to-TOK-sik", tr:"sitotoksik", trd:"Hücreleri öldüren bir şeyi tanımlayan kelime."},
  {term:"cell proliferation",   def:"Cells dividing and making more and more cells.", say:"pro-Lİ-fı-rey-şın", tr:"hücre çoğalması", trd:"Hücrelerin bölünüp daha çok hücre yapması."},
  {term:"apoptosis",            def:"The cell's own switch that tells it to die in a controlled way.", say:"a-pop-TO-sis", tr:"apoptoz", trd:"Hücrenin kendini kontrollü biçimde kapatma düğmesi."}
];

const SENTENCE_TASK = "Use this word in one sentence about OUR project.";

let deck = [], i = 0, revealed = false, mode = 1;
let closed = 0, redo = 0, seconds = 60, ticking = null, showTR = true;

const $ = id => document.getElementById(id);
const bar = document.querySelector(".bar");
const FULL = 295.3;

function shuffle(a){a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a}

function start(){
  deck = shuffle(TERMS); i = 0; closed = 0; redo = 0; revealed = false;
  stopTimer(); seconds = 60; $("sTime").textContent = 60; bar.style.strokeDashoffset = FULL;
  render();
}

function render(){
  const card = deck[i];
  if(!card){
    $("eyebrow").textContent = "All cases closed";
    $("prompt").className = "prompt";
    $("prompt").textContent = "Every word is yours now. Go and explain the project 🌍";
    $("answer").hidden = true;
    $("tap").textContent = "press Reshuffle to play again";
  } else if(mode === 1){
    $("eyebrow").textContent = "What is it?";
    $("prompt").className = "prompt";
    $("prompt").textContent = card.def;
    $("word").textContent = card.term;
    $("say").textContent = "say it: " + card.say;
    $("trterm").textContent = card.tr;
    $("trline").textContent = card.trd;
    $("trline").hidden = !showTR;
    $("answer").hidden = !revealed;
    $("tap").textContent = revealed ? "say it out loud, then score it" : "tap the dish to reveal";
  } else {
    $("eyebrow").textContent = SENTENCE_TASK;
    $("prompt").className = "prompt term";
    $("prompt").textContent = card.term;
    $("word").textContent = card.def;
    $("say").textContent = "say it: " + card.say;
    $("trterm").textContent = card.tr;
    $("trline").textContent = card.trd;
    $("trline").hidden = !showTR;
    $("answer").hidden = !revealed;
    $("tap").textContent = revealed ? "score it" : "tap for the meaning";
  }
  $("sClosed").textContent = closed;
  $("sRedo").textContent = redo;
  $("sLeft").textContent = Math.max(0, deck.length - i);
}

function reveal(){ if(deck[i]){ revealed = true; render(); } }
function score(ok){
  if(!deck[i]) return;
  if(ok) closed++; else { redo++; deck.push(deck[i]); }
  i++; revealed = false; render();
}

function tick(){
  seconds--; $("sTime").textContent = Math.max(0, seconds);
  bar.style.strokeDashoffset = FULL * (1 - (60 - seconds) / 60);
  if(seconds <= 0){ stopTimer(); $("eyebrow").textContent = "Time!"; }
}
function stopTimer(){ clearInterval(ticking); ticking = null; $("timer").textContent = "Start 60s"; }
function toggleTimer(){
  if(ticking){ stopTimer(); return; }
  seconds = 60; $("sTime").textContent = 60; bar.style.strokeDashoffset = FULL;
  ticking = setInterval(tick, 1000); $("timer").textContent = "Stop";
}

function setMode(m){
  mode = m; revealed = false;
  $("m1").setAttribute("aria-pressed", m === 1);
  $("m2").setAttribute("aria-pressed", m === 2);
  render();
}

$("dish").onclick = () => revealed ? score(true) : reveal();
$("dish").onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); $("dish").click(); } };
$("good").onclick  = () => score(true);
$("again").onclick = () => score(false);
$("timer").onclick = toggleTimer;
$("reset").onclick = start;
$("trBtn").onclick = () => { showTR = !showTR; $("trBtn").textContent = "TR: " + (showTR ? "açık" : "kapalı"); render(); };
$("m1").onclick = () => setMode(1);
$("m2").onclick = () => setMode(2);

document.addEventListener("keydown", e => {
  if(e.target.tagName === "BUTTON" && e.key === " ") return;
  if(e.key === " "){ e.preventDefault(); revealed ? score(true) : reveal(); }
  if(e.key === "1") score(true);
  if(e.key === "2") score(false);
  if(e.key.toLowerCase() === "t") toggleTimer();
  if(e.key.toLowerCase() === "r") $("trBtn").click();
});

start();
</script>
</body>
</html>
